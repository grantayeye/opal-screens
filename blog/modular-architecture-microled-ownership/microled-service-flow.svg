<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-labelledby="title desc"><title id="title">From a visible change to a verified fix</title><desc id="desc">Six steps: the owner notices a change, records it and contacts the dealer; the integrator diagnoses the signal chain or module, replaces or adjusts with a matched compatible part, and re-verifies uniformity and saved settings.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#29735e"/></marker></defs><rect width="800" height="400" fill="#f3f1e9"/>
<g font-family="Arial, sans-serif" fill="#1c2e28">
<text x="32" y="40" font-weight="700" font-size="24">From a visible change to a verified fix</text>
<rect x="32" y="56" width="14" height="14" fill="#ffffff" stroke="#758479"/><text x="54" y="68" font-size="14">Owner</text>
<rect x="120" y="56" width="14" height="14" fill="#dfeae4" stroke="#29735e"/><text x="142" y="68" font-size="14">Authorized integrator</text>
<g font-size="17">
<rect x="32" y="95" width="220" height="86" rx="6" fill="#ffffff" stroke="#758479"/><text x="48" y="128" font-weight="700">1. Notice a change</text><text x="48" y="156" font-size="14">dark spot, color shift, dropout</text>
<rect x="290" y="95" width="220" height="86" rx="6" fill="#ffffff" stroke="#758479"/><text x="306" y="128" font-weight="700">2. Record it</text><text x="306" y="156" font-size="14">photo, source, time of day</text>
<rect x="548" y="95" width="220" height="86" rx="6" fill="#ffffff" stroke="#758479"/><text x="564" y="128" font-weight="700">3. Contact your dealer</text><text x="564" y="156" font-size="14">leave the wall closed</text>
<rect x="548" y="260" width="220" height="86" rx="6" fill="#dfeae4" stroke="#29735e"/><text x="564" y="293" font-weight="700">4. Diagnose</text><text x="564" y="321" font-size="14">signal chain or display module</text>
<rect x="290" y="260" width="220" height="86" rx="6" fill="#dfeae4" stroke="#29735e"/><text x="306" y="293" font-weight="700">5. Replace or adjust</text><text x="306" y="321" font-size="14">matched compatible part</text>
<rect x="32" y="260" width="220" height="86" rx="6" fill="#dfeae4" stroke="#29735e"/><text x="48" y="293" font-weight="700">6. Re-verify</text><text x="48" y="321" font-size="14">uniformity and saved settings</text>
</g>
<g stroke="#29735e" stroke-width="2.5" fill="none" marker-end="url(#a)">
<path d="M254 138 H286"/><path d="M512 138 H544"/><path d="M658 183 V256"/><path d="M546 303 H514"/><path d="M288 303 H256"/>
</g></g></svg>
