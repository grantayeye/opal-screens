<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600" viewBox="0 0 400 600" role="img" aria-labelledby="title desc"><title id="title">Home gym plan around a MicroLED wall</title><desc id="desc">Room plan with the MicroLED wall on one end. An open floor zone with a mat sits directly in front of it, a bike and a treadmill sit to either side with a clear view, a mirror runs along a side wall, windows run along the other side, and weights sit at the far end of the room.</desc><rect width="400" height="600" fill="#f3f1e9"/>
<g font-family="Arial, sans-serif" fill="#1c2e28">
<text x="200" y="32" text-anchor="middle" font-weight="700" font-size="19">MicroLED wall</text>
<rect x="38" y="46" width="324" height="524" fill="#fbfaf5" stroke="#758479" stroke-width="2"/>
<rect x="84" y="46" width="232" height="13" fill="#193e32"/>
<g stroke="#758479" stroke-width="2" stroke-dasharray="6 5" fill="none"><path d="M86 214 L150 60"/><path d="M200 182 V60"/><path d="M312 196 L250 60"/></g>
<rect x="128" y="120" width="144" height="250" fill="none" stroke="#3d4a44" stroke-width="2" stroke-dasharray="5 4"/>
<rect x="146" y="182" width="108" height="70" fill="#d9d5c4"/>
<text x="200" y="222" text-anchor="middle" font-size="15" font-weight="700">Floor mat</text>
<text x="200" y="316" text-anchor="middle" font-size="14">Open floor for</text>
<text x="200" y="336" text-anchor="middle" font-size="14">standing work</text>
<rect x="52" y="214" width="66" height="44" fill="#3d4a44"/><text x="85" y="241" text-anchor="middle" font-size="15" fill="#f3f1e9" font-weight="700">Bike</text>
<rect x="280" y="196" width="72" height="104" fill="#3d4a44"/><text x="316" y="253" text-anchor="middle" font-size="13" fill="#f3f1e9" font-weight="700">Treadmill</text>
<rect x="64" y="470" width="272" height="72" fill="#e3dfcf" stroke="#9aa59d"/>
<text x="200" y="512" text-anchor="middle" font-size="15" font-weight="700">Weights, far from the wall</text>
<path d="M38 150 V430" stroke="#7f9ca0" stroke-width="8"/><text transform="translate(22 290) rotate(-90)" text-anchor="middle" font-size="14">Windows</text>
<path d="M362 130 V440" stroke="#9aa59d" stroke-width="8"/><text transform="translate(382 290) rotate(90)" text-anchor="middle" font-size="14">Mirror</text>
</g></svg>
