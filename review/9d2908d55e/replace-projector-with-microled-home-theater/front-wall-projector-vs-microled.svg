<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" role="img" aria-labelledby="title desc"><title id="title">Front wall before and after a MicroLED upgrade</title><desc id="desc">On the left, a projection screen with the left, center and right speakers hidden behind it. On the right, a solid MicroLED wall with the left and right speakers beside it and the center speaker just below it.</desc><rect width="800" height="360" fill="#f3f1e9"/>
<g font-family="Arial, sans-serif" fill="#1c2e28">
<text x="32" y="44" font-weight="700" font-size="24">Front wall, before and after</text>
<text x="208" y="88" text-anchor="middle" font-size="17" font-weight="700">Projector room</text>
<rect x="72" y="104" width="272" height="153" fill="#e3dfcf" stroke="#9aa59d" stroke-width="2"/>
<g fill="none" stroke="#3d4a44" stroke-width="2" stroke-dasharray="5 4"><rect x="90" y="186" width="34" height="62"/><rect x="175" y="216" width="66" height="26"/><rect x="292" y="186" width="34" height="62"/></g>
<path d="M40 280 H376" stroke="#758479" stroke-width="2"/>
<text x="208" y="308" text-anchor="middle" font-size="14">Speakers hidden behind an</text>
<text x="208" y="328" text-anchor="middle" font-size="14">acoustically transparent screen</text>
<text x="592" y="88" text-anchor="middle" font-size="17" font-weight="700">MicroLED wall</text>
<rect x="470" y="104" width="244" height="137" fill="#193e32"/>
<g fill="#3d4a44"><rect x="428" y="186" width="30" height="94"/><rect x="726" y="186" width="30" height="94"/><rect x="557" y="252" width="70" height="20"/></g>
<path d="M424 280 H760" stroke="#758479" stroke-width="2"/>
<text x="592" y="308" text-anchor="middle" font-size="14">Speakers beside the wall,</text>
<text x="592" y="328" text-anchor="middle" font-size="14">center speaker just below</text>
</g></svg>
