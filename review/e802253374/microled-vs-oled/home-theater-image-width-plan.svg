<svg xmlns="http://www.w3.org/2000/svg" width="800" height="460" viewBox="0 0 800 460" role="img" aria-labelledby="title desc"><title id="title">Size the image from the seats</title><desc id="desc">A home theater plan compares a standard panel width with a wider image sized to the room brief, showing the field of view each gives the main seats and the nearest seat. Dimensions are illustrative.</desc><rect width="800" height="460" fill="#f3f1e9"/>
<g font-family="Arial, sans-serif" fill="#1c2e28" font-size="17">
<text x="32" y="40" font-weight="700" font-size="24">Size the image from the seats</text>
<path d="M50 440 V100 H750 V440" fill="#e6e9df" stroke="#758479" stroke-width="3"/>
<g stroke-width="2" stroke-dasharray="7 6" fill="none"><path d="M400 352 L170 104 M400 352 L630 104" stroke="#29735e"/><path d="M400 352 L290 128 M400 352 L510 128" stroke="#9f661d"/></g>
<path d="M170 103 H630" stroke="#193e32" stroke-width="12"/>
<path d="M290 128 H510" stroke="#9f661d" stroke-width="8"/>
<text x="170" y="88" font-size="15" font-weight="700" fill="#29735e">Image sized to the room brief</text>
<text x="400" y="154" text-anchor="middle" font-size="15" fill="#7a4d14">Standard panel width</text>
<rect x="285" y="235" width="230" height="44" rx="6" fill="#ffffff" stroke="#758479"/><text x="400" y="263" text-anchor="middle">Nearest seat</text>
<rect x="250" y="330" width="300" height="48" rx="6" fill="#ffffff" stroke="#758479"/><text x="400" y="360" text-anchor="middle">Main seats</text>
<text x="590" y="250" font-size="14" fill="#29735e">Wider field of view</text><text x="590" y="268" font-size="14" fill="#29735e">from the main seats</text>
<text x="70" y="250" font-size="14" fill="#7a4d14">Narrower field from</text><text x="70" y="268" font-size="14" fill="#7a4d14">the same seats</text>
</g></svg>
