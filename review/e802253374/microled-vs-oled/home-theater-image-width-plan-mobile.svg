<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-labelledby="title desc"><title id="title">Size the image from the seats</title><desc id="desc">A home theater plan compares a standard panel width with a wider image sized to the room brief, showing the field of view each gives the main seats and the nearest seat. Dimensions are illustrative.</desc><rect width="400" height="560" fill="#f3f1e9"/>
<g font-family="Arial, sans-serif" fill="#1c2e28" font-size="16">
<text x="20" y="34" font-weight="700" font-size="20">Size the image</text><text x="20" y="58" font-weight="700" font-size="20">from the seats</text>
<path d="M20 540 V130 H380 V540" fill="#e6e9df" stroke="#758479" stroke-width="3"/>
<g stroke-width="2" stroke-dasharray="7 6" fill="none"><path d="M200 452 L45 134 M200 452 L355 134" stroke="#29735e"/><path d="M200 452 L125 156 M200 452 L275 156" stroke="#9f661d"/></g>
<path d="M45 133 H355" stroke="#193e32" stroke-width="10"/>
<path d="M125 156 H275" stroke="#9f661d" stroke-width="7"/>
<text x="20" y="96" font-size="14" font-weight="700" fill="#29735e">Image sized to the room brief</text>
<text x="20" y="116" font-size="14" fill="#7a4d14">Standard panel width</text>
<rect x="120" y="300" width="160" height="42" rx="6" fill="#ffffff" stroke="#758479"/><text x="200" y="327" text-anchor="middle">Nearest seat</text>
<rect x="95" y="440" width="210" height="46" rx="6" fill="#ffffff" stroke="#758479"/><text x="200" y="469" text-anchor="middle">Main seats</text>
<rect x="28" y="508" width="14" height="4" fill="#29735e"/><text x="48" y="515" font-size="13" fill="#29735e">Wider field of view</text>
<rect x="200" y="508" width="14" height="4" fill="#9f661d"/><text x="220" y="515" font-size="13" fill="#7a4d14">Narrower field</text>
</g></svg>
